name: CI - Lint, Test, Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --deadline=5m --tests=false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Lint Python with black
        run: |
          pip install black flake8
          black --check --line-length 100 *.py tests/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Lint JavaScript with ESLint
        run: |
          npm install eslint eslint-config-standard --save-dev
          npx eslint *.js || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Go tests
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: go

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Python tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload Python coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build for multiple platforms
        run: |
          mkdir -p dist
          
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -o dist/afarias19-linux-amd64 ./cmd/self-check
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -o dist/afarias19-linux-arm64 ./cmd/self-check
          
          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/afarias19-darwin-amd64 ./cmd/self-check
          
          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -o dist/afarias19-darwin-arm64 ./cmd/self-check
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -o dist/afarias19-windows-amd64.exe ./cmd/self-check

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: dist/

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: dist/

      - name: Test self-check binary
        run: |
          chmod +x dist/afarias19-linux-amd64
          ./dist/afarias19-linux-amd64 --help || true
          ./dist/afarias19-linux-amd64 --json > /tmp/self-check-result.json || true
          cat /tmp/self-check-result.json

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

  report:
    name: Report Status
    runs-on: ubuntu-latest
    needs: [lint, test, build, security-scan, integration-test]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.security-scan.result }}" = "failure" ]; then
            echo "❌ CI/CD Pipeline FAILED"
            exit 1
          else
            echo "✅ CI/CD Pipeline PASSED"
          fi

      - name: Summary
        run: |
          echo "## CI/CD Pipeline Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Lint | ${{ needs.lint.result }} |"
          echo "| Test | ${{ needs.test.result }} |"
          echo "| Build | ${{ needs.build.result }} |"
          echo "| Security | ${{ needs.security-scan.result }} |"
          echo "| Integration | ${{ needs.integration-test.result }} |"
